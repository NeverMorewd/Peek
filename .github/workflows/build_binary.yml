name: pack

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- .NET ---
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore .NET (using local nuget.config with token substitution)
        env:
          GH_PAT: ${{ secrets.GH_PACKAGES_TOKEN }}
        shell: pwsh
        run: |
          $template = "src/client/nuget.config"
          if (-not (Test-Path $template)) {
            Write-Error "nuget.config not found in repository root"
            exit 1
          }
          $content = Get-Content $template -Raw
          $content = $content.Replace('%GITHUB_TOKEN%', $env:GH_PAT)
          $tempConfig = "nuget.actions.config"
          $content | Out-File -FilePath $tempConfig -Encoding utf8
          dotnet restore src/client/Peek.slnx --configfile $tempConfig

      # --- Rust ---
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # --- Python ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean output directory
        shell: pwsh
        run: |
          $dist = "dist/win-x64"
          if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
          New-Item -ItemType Directory -Path $dist -Force

      - name: Build C# (AOT)
        shell: pwsh
        run: |
          $slnx = "src/client/Peek.slnx"

          dotnet publish $slnx `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishAot=true `
            -p:StripSymbols=true `
            -o dist/win-x64

          $libvlc = "dist/win-x64/libvlc"
          if (Test-Path $libvlc) {
            Get-ChildItem $libvlc -Directory | Where-Object { $_.Name -ne "win-x64" } | Remove-Item -Recurse -Force
          }

          Get-ChildItem dist/win-x64 -Recurse -Filter *.pdb | Remove-Item -Force

      - name: Build Python
        shell: pwsh
        run: |
          $spec = "src/tts/tts_server.spec"
          if (-not (Test-Path $spec)) { Write-Error "Spec file not found: $spec"; exit 1 }

          python -m pip install --upgrade pip
          python -m pip install edge-tts fastapi uvicorn pyinstaller

          $ttsDir = "src/tts"
          $distTmp = "$ttsDir/dist"
          $buildTmp = "$ttsDir/build"

          python -m PyInstaller $spec `
            --noconfirm `
            --distpath $distTmp `
            --workpath $buildTmp

          $srcFolder = "$distTmp/tts_server"
          $srcSingle = "$distTmp/tts_server_onefile.exe"

          if (Test-Path $srcFolder) {
            Copy-Item -Path "$srcFolder/*" -Destination dist/win-x64 -Recurse -Force
          } elseif (Test-Path $srcSingle) {
            Copy-Item -Path $srcSingle -Destination dist/win-x64/tts_server.exe -Force
          } else {
            Write-Error "PyInstaller produced no recognisable output"
            exit 1
          }

      - name: Build Rust
        shell: pwsh
        run: |
          $cargoToml = "src/worker/Cargo.toml"
          if (-not (Test-Path $cargoToml)) { Write-Error "Cargo.toml not found in src/worker"; exit 1 }
          cargo build --release --target x86_64-pc-windows-msvc --manifest-path $cargoToml
          $releaseDir = "src/worker/target/x86_64-pc-windows-msvc/release"
          if (Test-Path $releaseDir) {
            Get-ChildItem $releaseDir -Filter *.exe | ForEach-Object {
              Copy-Item $_.FullName -Destination dist/win-x64 -Force
            }
          } else {
            Write-Error "Release directory not found: $releaseDir"
            exit 1
          }

      - name: Verify build outputs
        shell: pwsh
        run: |
          Write-Host "`n[Build outputs] dist/win-x64"
          Get-ChildItem dist/win-x64 -Recurse -File | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 1)
            Write-Host ("  {0,-55} {1,7} MB" -f $_.Name, $sizeMB)
          }

      - name: Create zip
        run: |
          powershell Compress-Archive -Path dist\win-x64\* -DestinationPath Peek-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peek-win-x64
          path: Peek-win-x64.zip
